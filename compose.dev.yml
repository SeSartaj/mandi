# Local Docker development override with live reload.
#
# The production compose file bakes code into images and runs gunicorn/nginx.
# This override bind-mounts the source and runs the development servers, so a
# file change reloads immediately. The backend image is still built once for
# its Python dependencies; rebuild it only when requirements.txt changes.
#
# Usage (via the helper script):
#   scripts/dev-docker.sh start                   # API only, Vite on the host
#   scripts/dev-docker.sh start --with-frontend   # API + Vite in containers
#   scripts/dev-docker.sh start --with-central    # also start ODK Central + proxy
#
# Or directly:
#   docker compose -f compose.yml -f compose.dev.yml up -d mandi-db backend-blue
#   docker compose -f compose.yml -f compose.dev.yml --profile frontend up -d
#
# Stop the host stack first (scripts/dev-local.sh stop); both publish 8000/5174.

x-dev-environment: &dev-environment
  DJANGO_DEBUG: '1'
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  CORS_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
  CSRF_TRUSTED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:8000,http://127.0.0.1:8000

services:
  mandi-db:
    # Publish Postgres so a host-side Django/Vite can use the same database.
    ports:
      - '127.0.0.1:${DEV_POSTGRES_PORT:-5433}:5432'

  mandi-init:
    # Separate tag: rebuilding for new requirements never overwrites a release
    # image that rollback.sh may still need.
    image: mandi-backend:dev
    # The bind mount exposes the host's mode-600 mandi_backend/.env; run as
    # root for local development so Django can read it and write pyc/media.
    user: '0:0'
    environment: *dev-environment
    volumes:
      - ./mandi_backend:/app
      - mandi_media:/app/media
    command:
      - sh
      - -ec
      - >
        python manage.py migrate --noinput &&
        python manage.py bootstrap_admin &&
        python manage.py seed_locations

  backend-blue:
    image: mandi-backend:dev
    user: '0:0'
    environment: *dev-environment
    volumes:
      - ./mandi_backend:/app
      - mandi_media:/app/media
    # Django's autoreloader restarts on every saved .py file; no image rebuild.
    command: [python, manage.py, runserver, 0.0.0.0:8000]
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"
      interval: 5s
      timeout: 8s
      retries: 60
      start_period: 10s

  frontend:
    # Optional: only starts with --profile frontend. Uses the official Node
    # image and a named node_modules volume, so nothing is built into an image.
    image: node:24-bookworm-slim
    profiles: [frontend]
    user: '0:0'
    working_dir: /app
    command:
      - sh
      - -ec
      - >
        if [ ! -f node_modules/.package-lock.json ]; then
        npm ci --no-audit --no-fund;
        fi;
        exec npm run dev -- --host 0.0.0.0 --port 5174
    environment:
      # The browser calls Django directly, so the Vite proxy is bypassed.
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./mandi_frontend:/app
      - mandi_node_modules:/app/node_modules
    ports:
      - '127.0.0.1:5174:5174'
    networks: [mandi]
    depends_on:
      backend-blue:
        condition: service_healthy

  backend-green:
    image: mandi-backend:dev
    user: '0:0'
    environment: *dev-environment
    volumes:
      - ./mandi_backend:/app
      - mandi_media:/app/media
    command: [python, manage.py, runserver, 0.0.0.0:8000]

  worker:
    image: mandi-backend:dev
    user: '0:0'
    environment: *dev-environment
    volumes:
      - ./mandi_backend:/app
      - mandi_media:/app/media

  registry-worker:
    image: mandi-backend:dev
    user: '0:0'
    environment: *dev-environment
    volumes:
      - ./mandi_backend:/app
      - mandi_media:/app/media

  entities-worker:
    image: mandi-backend:dev
    user: '0:0'
    environment: *dev-environment
    volumes:
      - ./mandi_backend:/app
      - mandi_media:/app/media

volumes:
  # Container-local node_modules so the host folder stays untouched.
  mandi_node_modules: {name: mandi-node-modules}
