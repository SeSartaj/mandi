services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mandi
      POSTGRES_USER: mandi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - mandi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mandi']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mandi_postgres:
